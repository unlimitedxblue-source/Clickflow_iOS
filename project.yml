name: Clickflow
options:
  bundleIdPrefix: com.unlimitedxblue
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Clickflow:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Clickflow
        excludes:
          - "App/Info.plist"
    info:
      path: Clickflow/App/Info.plist
      properties:
        UIRequiredDeviceCapabilities:
          - arm64
          - gyroscope
          - accelerometer
        NSMotionUsageDescription: "Clickflow uses motion data to detect when your phone is face-down in your pocket so it can lock the screen and prevent accidental touches."
        CFBundleURLTypes:
          - CFBundleURLName: com.unlimitedxblue.clickflow
            CFBundleURLSchemes:
              - clickflow
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unlimitedxblue.clickflow
        PRODUCT_NAME: Clickflow
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: ""
        SWIFT_EMIT_LOC_STRINGS: true
        DEVELOPMENT_TEAM: 636CG2854J
        CODE_SIGN_STYLE: Automatic
